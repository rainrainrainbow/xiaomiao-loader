name: Build Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Clone ESP-IDF
        run: |
          mkdir -p ~/esp
          git clone -b v5.5.4 --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Install ESP-IDF
        run: |
          cd ~/esp/esp-idf
          ./install.sh esp32

      - name: Build firmware
        run: |
          . ~/esp/esp-idf/export.sh
          idf.py build

      - name: Generate merged binary (in build dir)
        run: |
          . ~/esp/esp-idf/export.sh
          idf.py merge-bin   # creates build/xiaomiao-loader-merged.bin

      - name: List build artifacts
        run: |
          ls -lh build/*.bin
          ls -lh *.bin 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomiao-loader-firmware
          path: |
            build/xiaomiao-loader.bin
            build/xiaomiao-loader-merged.bin
            build/flash_args
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
          retention-days: 30

      - name: Create Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/xiaomiao-loader.bin
            build/xiaomiao-loader-merged.bin
